  .title-button{display:block;background:none;border:0;padding:0;text-align:left;color:#fff;font-weight:760;font-size:16px;line-height:1.35;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Stream discovery and cover art */
.featured-stream{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.92fr);min-height:238px;margin:0 0 24px;overflow:hidden;border:1px solid #ffffff16;border-radius:20px;background:linear-gradient(115deg,#181a29,#111722 72%);box-shadow:0 16px 44px #0003}

<script>
(function(){

function fillDatalist(id,values){const dl=$(id);values.forEach(function(v){const op=document.createElement("option");op.value=v;dl.appendChild(op);});}
fillDatalist("performerOptions",performers);fillDatalist("artistOptions",artists);
function addOption(select,value,label){const op=document.createElement("option");op.value=value;op.textContent=label;select.appendChild(op);}
Array.from(months.keys()).sort().forEach(function(m){addOption(month,m,monthName(m));addOption($("mobileMonthSelect"),m,monthName(m));});
const sortedStreams=setlists.slice().sort(function(a,b){return a.streamDate.localeCompare(b.streamDate)||a.title.localeCompare(b.title);});

function currentFilters(){return {q:normalize(search.value),p:normalize(performer.value),a:normalize(artist.value),m:month.value,s:stream.value};}
function matchFilters(t,f){
  const hay=normalize(t.title+" "+t.artist+" "+t.performer+" "+t.streamTitle+" "+t.streamDate);
  return (!f.q||hay.indexOf(f.q)>=0)&&(!f.p||normalize(t.performer).indexOf(f.p)>=0)&&(!f.a||normalize(t.artist).indexOf(f.a)>=0)&&(!f.m||monthOf(t.streamDate)===f.m)&&(!f.s||t.setlistId===f.s);

function createButton(text,className,fn){const b=document.createElement("button");b.type="button";b.className=className;b.textContent=text;b.addEventListener("click",fn);return b;}

function renderFeatured(st,filteredSetlists){

function render(){

    const n=document.createElement("span");n.className="count-pill";n.textContent=String((s.songs||[]).length);b.appendChild(n);$("streamList").appendChild(b);
  });
  const featuredStream=selectedStream||(matchingSetlists[matchingSetlists.length-1])||sortedStreams[sortedStreams.length-1];
  renderFeatured(featuredStream,labels.length>0&&matchingSetlists.length>0);
  renderRecentStreams(matchingSetlists.length?matchingSetlists:sortedStreams,selectedStream&&selectedStream.id);
}
function setShuffleVisual(){const b=$("shuffleToggle");b.classList.toggle("active",shuffleOn);b.setAttribute("aria-pressed",shuffleOn?"true":"false");$("shuffleAll").classList.toggle("active",shuffleOn);}
function shuffleArray(items){const result=items.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=result[i];result[i]=result[j];result[j]=tmp;}return result;}
function shuffleWithFirst(items,key){const first=items.find(function(t){return t.key===key;});const rest=items.filter(function(t){return t.key!==key;});return first?[first].concat(shuffleArray(rest)):shuffleArray(items);}
// Ignore the previous clip's reported time until YouTube lands on the new seek target.
function isNearSegmentStart(seconds){
  const earlyTolerance=segmentDirection==="backward"?3:1.5;
  const lateTolerance=segmentDirection==="backward"?1.5:3;
  return seconds>=Math.max(0,segmentTarget-earlyTolerance)&&seconds<=segmentTarget+lateTolerance;
}
function isCurrentTrackPlaying(track){
  if(!playerReady||!player||!segmentReady||!currentTrack||currentTrack.key!==track.key)return false;
  try{return player.getPlayerState()===YT.PlayerState.PLAYING;}catch(e){return false;}
}
function refreshCurrentTrackButton(){
  if(!currentTrack)return;
  const row=Array.from(document.querySelectorAll(".track-row")).find(function(item){return item.dataset.trackKey===currentTrack.key;});
  if(!row)return;
  const button=row.querySelector(".play-row");if(!button)return;
  const playing=isCurrentTrackPlaying(currentTrack);
  button.textContent=playing?"播放中":"已選取";
  button.classList.toggle("is-playing",playing);
}
function showPlayer(track){
  playerCard.hidden=false;
  document.body.classList.add("player-open");
  $("nowTitle").textContent=track.title;
  $("nowSubtitle").textContent=track.performer+" · 原唱 "+track.artist+" · "+track.streamDate+" · "+track.streamTitle;
  $("playerStatus").textContent="正在載入";
  $("sourceLink").href=track.sourceCommentUrl;
  $("queueCount").textContent=(queueIndex+1)+" / "+queue.length+" 首";
  $("elapsed").textContent=fmt(0);
  $("duration").textContent=fmt(Math.max(0,track.endSeconds-track.startSeconds));
  $("progress").max=Math.max(1,track.endSeconds-track.startSeconds);
  $("progress").value=0;
  render();
}
function loadCurrent(){
  if(queueIndex<0||queueIndex>=queue.length){finishQueue();return;}
  const track=queue[queueIndex];
  const sameVideo=playerReady&&loadedVideoId===track.videoId;
  let previousTime=0;
  if(sameVideo){try{previousTime=player.getCurrentTime();}catch(e){}}
  segmentReady=false;segmentTarget=track.startSeconds;
  segmentDirection=sameVideo&&previousTime>segmentTarget+2?"backward":"forward";
  currentTrack=track;
  showPlayer(currentTrack);
  pendingTrack=currentTrack;
  if(playerReady){
    advancing=true;pendingTrack=null;loadedVideoId=track.videoId;
    try{
      if(sameVideo){
        player.seekTo(track.startSeconds,true);
        if(player.getPlayerState()!==YT.PlayerState.PLAYING)player.playVideo();
      }else{
        player.loadVideoById({videoId:track.videoId,startSeconds:track.startSeconds,endSeconds:track.endSeconds});
      }
    }catch(e){advancing=false;$("playerStatus").textContent="播放器載入失敗";showToast("播放器暫時無法載入，請稍後再試");}
  }
  else{pendingTrack=currentTrack;$("playerStatus").textContent="正在連接播放器";}
}
function finishQueue(){
  advancing=false;segmentReady=false;
  currentTrack=null;queueIndex=-1;pendingTrack=null;
  if(player&&playerReady){player.pauseVideo();}
  $("playerStatus").textContent="播放清單已播完";$("queueCount").textContent="目前清單已播放完畢";$("pauseButton").textContent="重播";$("pauseButton").setAttribute("aria-label","重播播放清單");render();
}
function startQueue(items,startKey,randomized){
  if(!items.length){showToast("目前篩選沒有歌曲");return;}
  baseQueue=items.slice();
  shuffleOn=!!randomized;
  queue=shuffleOn?shuffleWithFirst(baseQueue,startKey||baseQueue[0].key):baseQueue.slice();
  queueIndex=queue.findIndex(function(t){return t.key===(startKey||queue[0].key);});
  if(queueIndex<0)queueIndex=0;
  setShuffleVisual();
  loadCurrent();
}
function playAll(){startQueue(filtered.slice(),filtered[0]&&filtered[0].key,false);}
function shuffleAll(){startQueue(filtered.slice(),null,true);}
function playDirect(t){
  const f=currentFilters();
  const scoped=Boolean(f.q||f.p||f.a||f.m);
  const base=scoped?filtered.slice():allTracks.slice();
  startQueue(base,t.key,shuffleOn);
}
function advance(manual){
  if(!manual&&advancing)return;
  if(queueIndex<0||!currentTrack)return;
  if(queueIndex+1>=queue.length){finishQueue();return;}
  queueIndex++;loadCurrent();
}
function previous(){
  if(queueIndex<=0){
    if(currentTrack&&playerReady){
      let previousTime=0;try{previousTime=player.getCurrentTime();}catch(e){}
      segmentReady=false;segmentTarget=currentTrack.startSeconds;
      segmentDirection=previousTime>segmentTarget+2?"backward":"forward";advancing=true;
      player.seekTo(currentTrack.startSeconds,true);
      if(player.getPlayerState()!==YT.PlayerState.PLAYING)player.playVideo();
      refreshCurrentTrackButton();
    }
    return;
  }
  queueIndex--;loadCurrent();
}
$("playAll").addEventListener("click",playAll);
$("shuffleAll").addEventListener("click",shuffleAll);
$("loadMore").addEventListener("click",function(){pageSize+=100;render();});
$("searchInput").addEventListener("input",function(){ $("mobileSearchInput").value=this.value;render();});
$("performerInput").addEventListener("input",function(){ $("mobilePerformerInput").value=this.value;render();});
$("artistInput").addEventListener("input",function(){ $("mobileArtistInput").value=this.value;render();});
$("monthSelect").addEventListener("change",function(){ $("mobileMonthSelect").value=this.value;stream.value="";$("mobileStreamSelect").value="";render();});
$("streamSelect").addEventListener("change",function(){$("mobileStreamSelect").value=this.value;render();});
$("mobileSearchInput").addEventListener("input",function(){search.value=this.value;render();});
$("mobilePerformerInput").addEventListener("input",function(){performer.value=this.value;render();});
$("mobileArtistInput").addEventListener("input",function(){artist.value=this.value;render();});
$("mobileMonthSelect").addEventListener("change",function(){month.value=this.value;stream.value="";$("mobileStreamSelect").value="";render();});
$("mobileStreamSelect").addEventListener("change",function(){stream.value=this.value;render();window.scrollTo({top:0,behavior:"smooth"});});
$("clearFilters").addEventListener("click",function(){search.value="";performer.value="";artist.value="";month.value="";stream.value="";$('mobileSearchInput').value="";$('mobilePerformerInput').value="";$('mobileArtistInput').value="";$('mobileMonthSelect').value="";$('mobileStreamSelect').value="";pageSize=100;render();window.scrollTo({top:0,behavior:"smooth"});});
$("pauseButton").addEventListener("click",function(){
  if(!playerReady||!player)return;
  if(!currentTrack){if(baseQueue.length)startQueue(baseQueue,baseQueue[0].key,shuffleOn);return;}
  if(player.getPlayerState()===YT.PlayerState.PLAYING){player.pauseVideo();this.textContent="繼續";this.setAttribute("aria-label","繼續播放");$("playerStatus").textContent="已暫停";}
  else{player.playVideo();this.textContent="暫停";this.setAttribute("aria-label","暫停播放");$("playerStatus").textContent="正在載入";}
});
$("nextButton").addEventListener("click",function(){advance(true);});
$("previousButton").addEventListener("click",previous);
$("shuffleToggle").addEventListener("click",function(){
  shuffleOn=!shuffleOn;
  if(queue.length&&queueIndex>=0){
    if(shuffleOn){queue=queue.slice(0,queueIndex+1).concat(shuffleArray(queue.slice(queueIndex+1)));}
    else{const current=queue[queueIndex];queue=baseQueue.slice();queueIndex=Math.max(0,queue.findIndex(function(t){return t.key===current.key;}));}
  }
  setShuffleVisual();
});
$("miniToggle").addEventListener("click",function(){const c=playerCard.classList.toggle("compact");this.textContent=c?"還原":"縮小";this.setAttribute("aria-label",c?"還原播放器":"縮小播放器");});
$("progress").addEventListener("input",function(){if(playerReady&&player&&currentTrack)player.seekTo(currentTrack.startSeconds+Number(this.value),true);});
function updateProgress(){
  if(!playerReady||!player||!currentTrack)return;
  try{
    const now=player.getCurrentTime();
    const playing=player.getPlayerState()===YT.PlayerState.PLAYING;
    if(!segmentReady&&isNearSegmentStart(now)){
      segmentReady=true;advancing=false;
      $("playerStatus").textContent=playing?"正在播放":"已暫停";
      refreshCurrentTrackButton();
    }
    const rel=segmentReady?Math.max(0,Math.min(currentTrack.endSeconds-currentTrack.startSeconds,now-currentTrack.startSeconds)):0;
    $("progress").value=rel;$("elapsed").textContent=fmt(rel);
    $("pauseButton").textContent=playing?"暫停":"繼續";
    $("pauseButton").setAttribute("aria-label",playing?"暫停播放":"繼續播放");
    if(playing&&segmentReady&&now>=currentTrack.endSeconds-0.4&&!advancing)advance(false);
  }catch(e){}
}
function onPlayerStateChange(event){
  if(!window.YT)return;
  if(!currentTrack)return;
  let activeVideo="";try{activeVideo=player.getVideoData().video_id||"";}catch(e){}
  if(activeVideo&&activeVideo!==currentTrack.videoId)return;
  if(event.data===YT.PlayerState.PLAYING){
    let now=0;try{now=player.getCurrentTime();}catch(e){}
    if(!segmentReady&&isNearSegmentStart(now)){segmentReady=true;advancing=false;}
    $("playerStatus").textContent=segmentReady?"正在播放":"正在定位歌曲";
    $("pauseButton").textContent="暫停";$("pauseButton").setAttribute("aria-label","暫停播放");refreshCurrentTrackButton();
  }
  if(event.data===YT.PlayerState.ENDED&&segmentReady&&!advancing&&player.getPlayerState()===YT.PlayerState.ENDED)advance(false);
  if(event.data===YT.PlayerState.PAUSED){$("playerStatus").textContent="已暫停";$("pauseButton").textContent="繼續";$("pauseButton").setAttribute("aria-label","繼續播放");}
  if(event.data===YT.PlayerState.BUFFERING){$("playerStatus").textContent="正在載入";}
}
let playerApiTimeout=null;
function reportPlayerUnavailable(){
  if(playerReady||!currentTrack)return;
  $("playerStatus").textContent="播放器連線逾時";
  showToast("YouTube 播放器連不上，請按「開啟原留言時間軸」播放");
}
function initializeYouTubePlayer(){
  if(player||!window.YT||!YT.Player)return;
  const first=allTracks.find(function(t){return t.videoId;});
  if(!first)return;
  player=new YT.Player("ytPlayer",{width:"300",height:"169",videoId:first.videoId,playerVars:{autoplay:0,controls:1,rel:0,playsinline:1,iv_load_policy:3,vq:"hd1080"},events:{
    onReady:function(){playerReady=true;if(playerApiTimeout){clearTimeout(playerApiTimeout);playerApiTimeout=null;}if(pendingTrack){const pending=pendingTrack;pendingTrack=null;const ix=queue.findIndex(function(t){return t.key===pending.key;});if(ix>=0)queueIndex=ix;loadCurrent();}},
    onStateChange:onPlayerStateChange,
    onError:function(e){advancing=false;$("playerStatus").textContent="影片無法嵌入";showToast("此直播目前無法在網站內播放，請查看原留言連結");},
    onAutoplayBlocked:function(){advancing=false;$("playerStatus").textContent="自動播放被瀏覽器攔截";$("pauseButton").textContent="播放";$("pauseButton").setAttribute("aria-label","播放");showToast("瀏覽器封鎖自動播放，請點播放器中的播放按鈕");}
  }});
}
// Register the IFrame API callback before inserting its async script; otherwise
// a fast load can call the API-ready event before the handler exists.
window.onYouTubeIframeAPIReady=initializeYouTubePlayer;
if(window.YT&&YT.Player)initializeYouTubePlayer();
else{
  const api=document.createElement("script");api.src="https://www.youtube.com/iframe_api";api.async=true;
  api.onerror=reportPlayerUnavailable;
  playerApiTimeout=setTimeout(reportPlayerUnavailable,12000);
  document.head.appendChild(api);
}
window.setInterval(updateProgress,350);
render();
})();
</script>
