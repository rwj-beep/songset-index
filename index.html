/* Track artwork */
.cover-frame{position:relative;display:block;overflow:hidden;border-radius:inherit;background:radial-gradient(ellipse at 68% 22%,#a08aff66,transparent 37%),linear-gradient(135deg,#22223a,#11252d 62%,#17202e)}
.cover-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#e5ddff;transition:opacity .25s ease}
.cover-fallback span{font-size:34px;text-shadow:0 5px 25px #9778ff80}
.cover-fallback small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#d0c4ffb8}
.cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s ease}
.cover-frame.loaded .cover-image{opacity:1}
.cover-frame.loaded .cover-fallback{opacity:0}

.track-row{min-height:82px}

  const row=Array.from(document.querySelectorAll(".track-row")).find(function(item){return item.dataset.trackKey===currentTrack.key;});
  if(!row)return;
  const button=row.querySelector(".play-row");if(!button)return;
  const playing=isCurrentTrackPlaying(currentTrack);
  button.textContent=playing?"播放中":"已選取";
  button.classList.toggle("is-playing",playing);
}
function showPlayer(track){
  autoplayBlocked=false;
  playerDock.hidden=false;
  const compact=playerCard.classList.contains("compact");
  playerCard.hidden=compact;
  if(!compact)window.requestAnimationFrame(sizeYouTubePlayer);
  document.body.classList.add("player-open");
  $("nowTitle").textContent=track.title;
  $("nowTitle").setAttribute("aria-label","顯示〈"+track.title+"〉的演唱版本");
  $("currentArtwork").replaceChildren(makeCover(track.videoId,"player-cover",track.title+" 封面",track));
  $("currentArtwork").href=clipUrl(track);
  $("currentArtwork").setAttribute("aria-label","在 YouTube 開啟〈"+track.title+"〉原始片段");
  const subtitle=$("nowSubtitle");subtitle.replaceChildren();
  const performerLink=createButton(track.performer,"dock-filter-link",function(){filterByPerformer(track.performer);});performerLink.setAttribute("aria-label","篩選演唱者："+track.performer);
  const originalLabel=createButton("原唱 "+track.artist,"dock-filter-link",function(){filterByArtist(track.artist);});originalLabel.setAttribute("aria-label","篩選原唱："+track.artist);
  const dateLabel=document.createElement("span");dateLabel.textContent=track.streamDate;
  const streamLink=createButton(track.streamTitle,"dock-filter-link dock-stream-link",function(){selectStream(track.setlistId);});streamLink.setAttribute("aria-label","顯示歌回場次："+track.streamDate+" · "+track.streamTitle);
  subtitle.append(performerLink,document.createTextNode(" · "),originalLabel,document.createTextNode(" · "),dateLabel,document.createTextNode(" · "),streamLink);
  $("playerStatus").textContent="正在載入";
  $("sourceLink").href=track.sourceCommentUrl;
  $("queueCount").textContent=(queueIndex+1)+" / "+queue.length+" 首";
  renderQueue();
  $("elapsed").textContent=fmt(0);
  $("duration").textContent=fmt(Math.max(0,track.endSeconds-track.startSeconds));
  $("progress").max=Math.max(1,track.endSeconds-track.startSeconds);
  $("progress").value=0;
  render();
}
function loadCurrent(){
  if(queueIndex<0||queueIndex>=queue.length){finishQueue();return;}
  const track=queue[queueIndex];
  const sameVideo=playerReady&&loadedVideoId===track.videoId;
  let previousTime=0;
  if(sameVideo){try{previousTime=player.getCurrentTime();}catch(e){}}
  segmentReady=false;segmentTarget=track.startSeconds;
  segmentDirection=sameVideo&&previousTime>segmentTarget+2?"backward":"forward";
  currentTrack=track;
  showPlayer(currentTrack);
  pendingTrack=currentTrack;
  if(playerReady){
    advancing=true;pendingTrack=null;loadedVideoId=track.videoId;
    try{
      if(sameVideo){
        player.seekTo(track.startSeconds,true);
        if(player.getPlayerState()!==YT.PlayerState.PLAYING)player.playVideo();
      }else{
        player.loadVideoById({videoId:track.videoId,startSeconds:track.startSeconds,endSeconds:track.endSeconds});
      }
    }catch(e){advancing=false;$("playerStatus").textContent="播放器載入失敗";showToast("播放器暫時無法載入，請稍後再試");}
  }
  else{pendingTrack=currentTrack;$("playerStatus").textContent="正在連接播放器";}
}
function finishQueue(){
  advancing=false;segmentReady=false;
  currentTrack=null;queueIndex=-1;pendingTrack=null;
  if(player&&playerReady){player.pauseVideo();}
  $("playerStatus").textContent="播放清單已播完";$("queueCount").textContent="目前清單已播放完畢";$("pauseButton").textContent="重播";$("pauseButton").setAttribute("aria-label","重播播放清單");renderQueue();render();
}
function startQueue(items,startKey,randomized){
  if(!items.length){showToast("目前篩選沒有歌曲");return;}
  playerCard.classList.remove("compact","queue-open","queue-collapsed");
  playerCard.hidden=false;playerDock.hidden=false;
  $("miniToggle").textContent="縮小";$("miniToggle").setAttribute("aria-label","縮小播放器");
  $("queueToggle").setAttribute("aria-expanded",window.matchMedia("(max-width: 1080px)").matches?"false":"true");
  baseQueue=items.slice();
  shuffleOn=!!randomized;
  queue=shuffleOn?shuffleWithFirst(baseQueue,startKey||baseQueue[0].key):baseQueue.slice();
  queueIndex=queue.findIndex(function(t){return t.key===(startKey||queue[0].key);});
  if(queueIndex<0)queueIndex=0;
  setShuffleVisual();
  loadCurrent();
}
function playAll(){startQueue(filtered.slice(),filtered[0]&&filtered[0].key,false);}
function shuffleAll(){startQueue(filtered.slice(),null,true);}
function playDirect(t){
  const f=currentFilters();
  const scoped=Boolean(f.q||f.p||f.a||f.m);
  const base=scoped?filtered.slice():allTracks.slice();
  startQueue(base,t.key,shuffleOn);
}
function advance(manual){
  if(!manual&&advancing)return;
  if(queueIndex<0||!currentTrack)return;
  if(queueIndex+1>=queue.length){finishQueue();return;}
  queueIndex++;loadCurrent();
}
function previous(){
  if(queueIndex<=0){
    if(currentTrack&&playerReady){
      let previousTime=0;try{previousTime=player.getCurrentTime();}catch(e){}
      segmentReady=false;segmentTarget=currentTrack.startSeconds;
      segmentDirection=previousTime>segmentTarget+2?"backward":"forward";advancing=true;
      player.seekTo(currentTrack.startSeconds,true);
      if(player.getPlayerState()!==YT.PlayerState.PLAYING)player.playVideo();
      refreshCurrentTrackButton();
    }
    return;
  }
  queueIndex--;loadCurrent();
}
$("playAll").addEventListener("click",playAll);
$("shuffleAll").addEventListener("click",shuffleAll);
$("loadMore").addEventListener("click",function(){pageSize+=100;render();});
$("searchInput").addEventListener("input",function(){ $("mobileSearchInput").value=this.value;recordTextFilterHistory();render();});
$("performerInput").addEventListener("input",function(){ $("mobilePerformerInput").value=this.value;recordTextFilterHistory();render();});
$("artistInput").addEventListener("input",function(){ $("mobileArtistInput").value=this.value;recordTextFilterHistory();render();});
$("monthSelect").addEventListener("change",function(){ $("mobileMonthSelect").value=this.value;stream.value="";$("mobileStreamSelect").value="";recordFilterNavigation();render();});
$("streamSelect").addEventListener("change",function(){$("mobileStreamSelect").value=this.value;recordFilterNavigation();render();});
$("mobileSearchInput").addEventListener("input",function(){search.value=this.value;recordTextFilterHistory();render();});
$("mobilePerformerInput").addEventListener("input",function(){performer.value=this.value;recordTextFilterHistory();render();});
$("mobileArtistInput").addEventListener("input",function(){artist.value=this.value;recordTextFilterHistory();render();});
$("mobileMonthSelect").addEventListener("change",function(){month.value=this.value;stream.value="";$("mobileStreamSelect").value="";recordFilterNavigation();render();});
$("mobileStreamSelect").addEventListener("change",function(){stream.value=this.value;recordFilterNavigation();render();window.scrollTo({top:0,behavior:"smooth"});});
$("clearFilters").addEventListener("click",function(){search.value="";performer.value="";artist.value="";month.value="";stream.value="";$('mobileSearchInput').value="";$('mobilePerformerInput').value="";$('mobileArtistInput').value="";$('mobileMonthSelect').value="";$('mobileStreamSelect').value="";pageSize=100;recordFilterNavigation();render();window.scrollTo({top:0,behavior:"smooth"});});
window.addEventListener("popstate",function(event){restoreFilterHistory(event.state);});
window.addEventListener("auxclick",function(event){
  if(event.button!==3&&event.button!==4)return;
  event.preventDefault();
  event.stopImmediatePropagation();
  if(event.button===3)history.back();else history.forward();
},true);
$("pauseButton").addEventListener("click",function(){
  if(!playerReady||!player)return;
  if(!currentTrack){if(baseQueue.length)startQueue(baseQueue,baseQueue[0].key,shuffleOn);return;}
  if(player.getPlayerState()===YT.PlayerState.PLAYING){player.pauseVideo();this.textContent="繼續";this.setAttribute("aria-label","繼續播放");$("playerStatus").textContent="已暫停";}
  else{autoplayBlocked=false;player.playVideo();this.textContent="暫停";this.setAttribute("aria-label","暫停播放");$("playerStatus").textContent="正在載入";}
});
$("nextButton").addEventListener("click",function(){advance(true);});
$("previousButton").addEventListener("click",previous);
$("nowTitle").addEventListener("click",function(){if(!currentTrack)return;filterByTitle(currentTrack.title);showToast("顯示〈"+currentTrack.title+"〉的演唱版本");});
$("shuffleToggle").addEventListener("click",function(){
  shuffleOn=!shuffleOn;
  if(queue.length&&queueIndex>=0){
    if(shuffleOn){queue=queue.slice(0,queueIndex+1).concat(shuffleArray(queue.slice(queueIndex+1)));}
    else{const current=queue[queueIndex];queue=baseQueue.slice();queueIndex=Math.max(0,queue.findIndex(function(t){return t.key===current.key;}));}
  }
  setShuffleVisual();
});
$("miniToggle").addEventListener("click",function(){const c=playerCard.classList.toggle("compact");playerCard.hidden=c;playerDock.hidden=false;this.textContent=c?"展開":"縮小";this.setAttribute("aria-label",c?"展開播放器":"縮小播放器");if(!c)window.requestAnimationFrame(sizeYouTubePlayer);});
$("queueToggle").addEventListener("click",function(){
  if(playerCard.classList.contains("compact")){playerCard.classList.remove("compact");playerCard.hidden=false;$("miniToggle").textContent="縮小";$("miniToggle").setAttribute("aria-label","縮小播放器");window.requestAnimationFrame(sizeYouTubePlayer);}
  const narrow=window.matchMedia("(max-width: 1080px)").matches;
  const activeClass=narrow?"queue-open":"queue-collapsed";
  const open=playerCard.classList.toggle(activeClass);
  this.setAttribute("aria-expanded",narrow?(open?"true":"false"):(open?"false":"true"));
  renderedQueueIndex=-1;renderQueue();
});
$("progress").addEventListener("input",function(){if(playerReady&&player&&currentTrack)player.seekTo(currentTrack.startSeconds+Number(this.value),true);});
function updateProgress(){
  if(!playerReady||!player||!currentTrack)return;
  try{
    const now=player.getCurrentTime();
    const playing=player.getPlayerState()===YT.PlayerState.PLAYING;
    if(!segmentReady&&isNearSegmentStart(now)){
      segmentReady=true;advancing=false;
      $("playerStatus").textContent=playing?"正在播放":"已暫停";
      refreshCurrentTrackButton();
    }
    const rel=segmentReady?Math.max(0,Math.min(currentTrack.endSeconds-currentTrack.startSeconds,now-currentTrack.startSeconds)):0;
    $("progress").value=rel;$("elapsed").textContent=fmt(rel);
    $("pauseButton").textContent=playing?"暫停":"繼續";
    $("pauseButton").setAttribute("aria-label",playing?"暫停播放":"繼續播放");
    if(playing&&segmentReady&&now>=currentTrack.endSeconds-0.4&&!advancing)advance(false);
  }catch(e){}
}
function onPlayerStateChange(event){
  if(!window.YT)return;
  if(!currentTrack)return;
  let activeVideo="";try{activeVideo=player.getVideoData().video_id||"";}catch(e){}
  if(activeVideo&&activeVideo!==currentTrack.videoId)return;
  if(event.data===YT.PlayerState.PLAYING){
    autoplayBlocked=false;
    let now=0;try{now=player.getCurrentTime();}catch(e){}
    if(!segmentReady&&isNearSegmentStart(now)){segmentReady=true;advancing=false;}
    $("playerStatus").textContent=segmentReady?"正在播放":"正在定位歌曲";
    $("pauseButton").textContent="暫停";$("pauseButton").setAttribute("aria-label","暫停播放");refreshCurrentTrackButton();
  }
  if(event.data===YT.PlayerState.ENDED&&segmentReady&&!advancing&&player.getPlayerState()===YT.PlayerState.ENDED)advance(false);
  if(event.data===YT.PlayerState.PAUSED){if(!autoplayBlocked){$("playerStatus").textContent="已暫停";$("pauseButton").textContent="繼續";$("pauseButton").setAttribute("aria-label","繼續播放");}}
  if(event.data===YT.PlayerState.BUFFERING){$("playerStatus").textContent="正在載入";}
}
let playerApiTimeout=null;
function reportPlayerUnavailable(){
  if(playerReady||!currentTrack)return;
  $("playerStatus").textContent="播放器連線逾時";
  showToast("YouTube 播放器連不上，請按「開啟原留言時間軸」播放");
}
function sizeYouTubePlayer(){
  if(!playerReady||!player)return;
  const frame=$("ytPlayer");
  try{player.setSize(Math.max(200,frame.clientWidth),Math.max(200,frame.clientHeight));}catch(e){}
}
window.addEventListener("resize",sizeYouTubePlayer);
function initializeYouTubePlayer(){
  if(player||!window.YT||!YT.Player)return;
  const first=allTracks.find(function(t){return t.videoId;});
  if(!first)return;
  player=new YT.Player("ytPlayer",{width:"300",height:"200",videoId:first.videoId,playerVars:{autoplay:0,controls:1,rel:0,playsinline:1,iv_load_policy:3,vq:"hd1080"},events:{
    onReady:function(){playerReady=true;sizeYouTubePlayer();if(playerApiTimeout){clearTimeout(playerApiTimeout);playerApiTimeout=null;}if(pendingTrack){const pending=pendingTrack;pendingTrack=null;const ix=queue.findIndex(function(t){return t.key===pending.key;});if(ix>=0)queueIndex=ix;loadCurrent();}},
    onStateChange:onPlayerStateChange,
    onError:function(e){advancing=false;$("playerStatus").textContent="影片無法嵌入";showToast("此直播目前無法在網站內播放，請查看原留言連結");},
    onAutoplayBlocked:function(){autoplayBlocked=true;advancing=false;$("playerStatus").textContent="自動播放被瀏覽器攔截";$("pauseButton").textContent="重試播放";$("pauseButton").setAttribute("aria-label","重試播放");showToast("瀏覽器封鎖了影片播放；請再按「重試播放」或點影片內的播放鍵");}
  }});
}
// Register the IFrame API callback before inserting its async script; otherwise
// a fast load can call the API-ready event before the handler exists.
window.onYouTubeIframeAPIReady=initializeYouTubePlayer;
if(window.YT&&YT.Player)initializeYouTubePlayer();
else{
  const api=document.createElement("script");api.src="https://www.youtube.com/iframe_api";api.async=true;
  api.onerror=reportPlayerUnavailable;
  playerApiTimeout=setTimeout(reportPlayerUnavailable,12000);
  document.head.appendChild(api);
}
window.setInterval(updateProgress,350);
if(!history.state||!history.state.songsetFilters)history.replaceState(Object.assign({},history.state||{},{songsetFilters:currentFilterHistory()}),"",location.href);
render();
})();
</script>
</body>
